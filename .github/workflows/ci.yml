name: CI

on: [push]

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Push to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            # Toute erreur fait échouer le déploiement (avant, un git en échec passait inaperçu)
            set -e

            cd ${{ secrets.PROJECT_PATH }}

            # safe.directory : root refuse sinon un dépôt appartenant à debian ("dubious ownership")
            sudo git -c safe.directory="$PWD" fetch --all
            sudo git -c safe.directory="$PWD" reset --hard origin/main
            sudo chown -R debian:debian ${{ secrets.PROJECT_PATH }}
            echo "Version déployée : $(git -c safe.directory="$PWD" log -1 --oneline)"

            npm install
            npm run build

            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
